name: Consumer desktop release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: consumer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-windows.lock
      - name: Validate version and PowerShell 5.1 bootstrap
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: powershell
        run: |
          $version = python -c "import re; from core.version import VERSION; assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', VERSION); print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid application version.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") { throw 'Tag and application version differ.' }
          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Parse PowerShell 7 bootstrap
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Test and build locked Windows package
        run: ./packaging/build.ps1
      - name: Smoke frozen executable
        run: ./packaging/smoke.ps1 -Executable dist/B2BContactFinder/B2BContactFinder.exe -OutputFile frozen-smoke-result.json
      - name: Sign executable when credentials exist
        if: github.event_name != 'pull_request'
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
        run: ./packaging/sign.ps1 -File dist/B2BContactFinder/B2BContactFinder.exe
      - name: Install checksum-pinned Inno Setup 6.4.3
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          try {
            Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $setup
            if ((Get-FileHash $setup -Algorithm SHA256).Hash -ine 'f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b') { throw 'Inno Setup checksum mismatch.' }
            $destination = Join-Path $env:RUNNER_TEMP 'InnoSetup'
            $process = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="' + $destination + '"') -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup install failed: $($process.ExitCode)" }
            "INNO_COMPILER=$destination\ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Remove-Item $setup -Force -ErrorAction SilentlyContinue }
      - name: Compile and optionally sign installer
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
        run: |
          & $env:INNO_COMPILER "/DAppVersion=$env:APP_VERSION" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno compilation failed.' }
          if ('${{ github.event_name }}' -ne 'pull_request') { ./packaging/sign.ps1 -File "dist/release/B2BContactFinder-$env:APP_VERSION-windows-x64-setup.exe" }
      - name: Verify install, upgrade, data retention and uninstall
        run: ./packaging/check_installer.ps1 -Installer "dist/release/B2BContactFinder-$env:APP_VERSION-windows-x64-setup.exe"
      - name: Write Windows provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $installer = Get-Item "dist/release/B2BContactFinder-$env:APP_VERSION-windows-x64-setup.exe"
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -notin @('Valid','NotSigned')) { throw "Invalid signature: $($signature.Status)" }
          $status = if ($signature.Status -eq 'Valid') { 'signed' } else { 'unsigned' }
          $publisher = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
          [ordered]@{app='b2b-contact-finder';version=$env:APP_VERSION;platform='windows-x64';python='3.12.10';source_commit=$env:SOURCE_SHA;signing=$status;publisher=$publisher} | ConvertTo-Json | Set-Content dist/release/build-info-windows-x64.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-windows-x64
          path: |
            dist/release/*
          if-no-files-found: error
          retention-days: 14

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
            lock: packaging/requirements-macos-arm64.lock
          - runner: macos-15-intel
            arch: x64
            python_arch: x64
            lock: packaging/requirements-macos-x64.lock
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Validate version and bootstrap syntax
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash -n install-macos.sh
          version="$(python -c "import re; from core.version import VERSION; assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', VERSION); print(VERSION)")"
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then echo 'Tag and application version differ.' >&2; exit 1; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test and build locked macOS app
        run: PYTHON=python3 packaging/build_macos.sh
      - name: Sign and notarize when credentials exist
        if: github.event_name != 'pull_request'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/sign_macos.sh 'dist/B2B Contact Finder.app'
      - name: Ad-hoc sign pull-request builds
        if: github.event_name == 'pull_request'
        run: env -i PATH="$PATH" HOME="$HOME" packaging/sign_macos.sh 'dist/B2B Contact Finder.app'
      - name: Smoke actual app bundle and archive
        run: |
          packaging/smoke_macos.sh 'dist/B2B Contact Finder.app' macos-smoke-result.json
          packaging/package_macos.sh 'dist/B2B Contact Finder.app' "dist/release/B2BContactFinder-$APP_VERSION-macos-${{ matrix.arch }}.zip"
          packaging/check_macos_install.sh "dist/release/B2BContactFinder-$APP_VERSION-macos-${{ matrix.arch }}.zip"
      - name: Write macOS provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          status="${MACOS_SIGNING_STATUS:-unsigned}"
          printf '{"app":"b2b-contact-finder","version":"%s","platform":"macos-${{ matrix.arch }}","python":"3.12.10","source_commit":"%s","signing":"%s"}\n' "$APP_VERSION" "$SOURCE_SHA" "$status" > "dist/release/build-info-macos-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-macos-${{ matrix.arch }}
          path: |
            dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: consumer-*
          path: release
          merge-multiple: true
      - name: Verify artifact versions and create unified checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          expected=(
            "B2BContactFinder-$version-windows-x64-setup.exe"
            "B2BContactFinder-$version-macos-arm64.zip"
            "B2BContactFinder-$version-macos-x64.zip"
            "build-info-windows-x64.json"
            "build-info-macos-arm64.json"
            "build-info-macos-x64.json"
          )
          for file in "${expected[@]}"; do
            test -f "release/$file" || { echo "Missing release artifact: $file" >&2; exit 1; }
          done
          for info in release/build-info-*.json; do
            test "$(jq -r .version "$info")" = "$version" || { echo "Version mismatch: $info" >&2; exit 1; }
          done
          cd release
          sha256sum "${expected[@]}" > SHA256SUMS.txt
      - name: Publish validated Windows and macOS release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes='Desktop installers for Windows x64 and macOS Apple Silicon/Intel. No Python, Git or Docker required. User data is retained during upgrades. Check each build-info file for signing status.'
          gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag --title "B2B Contact Finder ${RELEASE_TAG#v}" --notes "$notes" release/B2BContactFinder-* release/build-info-*.json release/SHA256SUMS.txt
