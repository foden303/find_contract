services:
  # Self-hosted metasearch. Federates Google, Bing, Brave and others behind one
  # endpoint: no API key, no per-query cost, and the rate limit is yours.
  searxng:
    # Pinned deliberately loosely: this is a local tool and SearXNG ships
    # frequent engine fixes. To pin, replace with a dated tag from
    # https://hub.docker.com/r/searxng/searxng/tags e.g. searxng:2025.1.1-abc123
    image: searxng/searxng:latest
    container_name: finder-searxng
    restart: unless-stopped
    volumes:
      # Read-write because SearXNG's entrypoint rewrites settings.yml on boot
      # (it injects the secret and normalises the file).
      - ./searxng:/etc/searxng:rw
    environment:
      # No default on purpose: a shared, publicly-known secret is worse than a
      # startup failure. `install.sh` / `install.ps1` generate .env for you.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run ./install.sh (or install.ps1) first, or set SEARXNG_SECRET in .env}
      SEARXNG_BASE_URL: http://localhost:8080/
    # Not published to the host by default — only the app container needs it.
    # Uncomment to open http://127.0.0.1:8080 and search by hand.
    # ports:
    #   - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build: .
    container_name: finder-app
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    ports:
      # Bound to 127.0.0.1 on purpose: the UI has no authentication, so it must
      # not be reachable from the network. Change only if you add auth first.
      - "127.0.0.1:${FINDER_PORT:-8765}:8765"
    environment:
      FINDER_HOST: 0.0.0.0
      FINDER_SEARCH_PROVIDER: searxng
      FINDER_SEARXNG_URL: http://searxng:8080
      FINDER_CACHE_DIR: /data
    volumes:
      # Caches, run history and uploads survive a rebuild
      - finder-data:/data
      - finder-uploads:/app/.uploads

volumes:
  finder-data:
  finder-uploads:
